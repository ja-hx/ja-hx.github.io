      { q: "She completely finished the difficult project all by ___.", o: ["herself", "hers", "her", "she"], a: 0, c: "Pronouns" },
      { q: "The unknown man ___ stole the red car was finally caught.", o: ["who", "which", "whom", "what"], a: 0, c: "Pronouns" },
      { q: "To ___ did you secretly send the confidential letter?", o: ["whom", "who", "whose", "which"], a: 0, c: "Pronouns" },
      { q: "The dog happily wagged ___ tail when the owner arrived.", o: ["its", "it's", "it", "itself"], a: 0, c: "Pronouns" },
      { q: "The woman ___ car was stolen reported it to the police.", o: ["whose", "who", "whom", "which"], a: 0, c: "Pronouns" },
      { q: "They successfully built the treehouse entirely by ___.", o: ["themselves", "theirselves", "them", "they"], a: 0, c: "Pronouns" },
      { q: "Please hand those important documents directly to ___.", o: ["him", "he", "his", "himself"], a: 0, c: "Pronouns" },
      { q: "I firmly believe that ___ going to rain tomorrow.", o: ["it's", "its", "it", "itself"], a: 0, c: "Pronouns" },
      { q: "The specific car ___ is parked outside belongs to John.", o: ["that", "who", "whom", "whose"], a: 0, c: "Pronouns" },

      // 181-190: Comparatives & Superlatives
      { q: "Of the two brothers, he is definitively the ___.", o: ["taller", "tallest", "tall", "more tall"], a: 0, c: "Comparatives" },
      { q: "Mount Everest is officially the ___ mountain in the world.", o: ["tallest", "taller", "tall", "most tall"], a: 0, c: "Comparatives" },
      { q: "This painting is visually ___ beautiful than that one.", o: ["more", "most", "much", "many"], a: 0, c: "Comparatives" },
      { q: "That was easily the ___ beautiful sunset I have ever seen.", o: ["most", "more", "much", "many"], a: 0, c: "Comparatives" },
      { q: "This severe cold is significantly ___ than the last one.", o: ["worse", "worst", "bad", "more bad"], a: 0, c: "Comparatives" },
      { q: "That was undisputedly the ___ movie I have ever endured.", o: ["worst", "worse", "bad", "most bad"], a: 0, c: "Comparatives" },
      { q: "Her test score is definitively ___ than mine.", o: ["better", "best", "good", "more good"], a: 0, c: "Comparatives" },
      { q: "He is recognized as the ___ player on the entire team.", o: ["best", "better", "good", "most good"], a: 0, c: "Comparatives" },
      { q: "Please contact the front desk for ___ information.", o: ["further", "farther", "farthest", "furthest"], a: 0, c: "Comparatives" },
      { q: "The isolated cabin was much ___ down the road than expected.", o: ["farther", "further", "farthest", "furthest"], a: 0, c: "Comparatives" },

      // 191-195: Modals
      { q: "You ___ not park here; it is a strictly designated tow zone.", o: ["must", "can", "should", "might"], a: 0, c: "Modals" },
      { q: "I ___ easily swim across the deep pool when I was four.", o: ["could", "can", "might", "should"], a: 0, c: "Modals" },
      { q: "You definitely ___ see a doctor about that persistent cough.", o: ["should", "would", "might", "can"], a: 0, c: "Modals" },
      { q: "They ___ arrive late due to the heavy highway traffic.", o: ["might", "must", "can", "should"], a: 0, c: "Modals" },
      { q: "We ___ have to wear a uniform on casual Fridays.", o: ["don't", "mustn't", "shouldn't", "can't"], a: 0, c: "Modals" },

      // 196-200: Conditionals & Gerunds/Infinitives
      { q: "She thoroughly enjoys ___ thick books in her free time.", o: ["reading", "read", "to read", "reads"], a: 0, c: "Verb Patterns" },
      { q: "She sternly promised ___ late to the morning meeting again.", o: ["not to be", "not being", "to not be", "don't be"], a: 0, c: "Verb Patterns" },
      { q: "If pure water is heated to 100 degrees Celsius, it always ___.", o: ["boils", "boiled", "will boil", "would boil"], a: 0, c: "Conditionals" },
      { q: "If he had run much faster, he ___ the departing train.", o: ["would have caught", "will catch", "caught", "catches"], a: 0, c: "Conditionals" },
      { q: "They officially decided ___ the city earlier than planned.", o: ["to leave", "leaving", "leave", "left"], a: 0, c: "Verb Patterns" }
    ];

    const GAME_TIME = 10;

    const getNewQuestionState = (currentIndex = -1) => {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * questions.length);
      } while (nextIndex === currentIndex);
      
      const q = questions[nextIndex];
      const correctStr = q.o[q.a];
      
      const shuffled = [...q.o];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return { 
        index: nextIndex, 
        text: q.q, 
        category: q.c, 
        options: shuffled, 
        correctStr: correctStr 
      };
    };

    const QuizWidget = () => {
      const [quizState, setQuizState] = useState(() => getNewQuestionState());
      const [timeLeft, setTimeLeft] = useState(GAME_TIME);
      
      const [score, setScore] = useState(0); 
      const [isPaused, setIsPaused] = useState(false);
      const [isGameOver, setIsGameOver] = useState(false);
      
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [isTimeout, setIsTimeout] = useState(false);
      const timerRef = useRef(null);

      const getNextQuestion = useCallback(() => {
        if (isGameOver) return;
        setSelectedAnswer(null);
        setIsTimeout(false);
        setTimeLeft(GAME_TIME);
        setQuizState(getNewQuestionState(quizState.index));
      }, [quizState.index, isGameOver]);

      useEffect(() => {
        if (selectedAnswer !== null || isTimeout || isPaused || isGameOver) return;

        timerRef.current = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 0.1) {
              clearInterval(timerRef.current);
              setIsTimeout(true);
              setTimeout(getNextQuestion, 1500);
              return 0;
            }
            return prev - 0.1;
          });
        }, 100);

        return () => clearInterval(timerRef.current);
      }, [selectedAnswer, isTimeout, isPaused, isGameOver, getNextQuestion]);

      const handleAnswer = (index) => {
        if (selectedAnswer !== null || isTimeout || isPaused || isGameOver) return;
        
        setSelectedAnswer(index);
        clearInterval(timerRef.current);

        const isCorrect = quizState.options[index] === quizState.correctStr;
        if (isCorrect) {
          setScore(s => s + 1);
        }

        setTimeout(getNextQuestion, 1500);
      };

      const handleRestart = () => {
        setScore(0);
        setIsGameOver(false);
        setIsPaused(false);
        setSelectedAnswer(null);
        setIsTimeout(false);
        setTimeLeft(GAME_TIME);
        setQuizState(getNewQuestionState());
      };

      const getButtonColor = (index) => {
        if (selectedAnswer === null && !isTimeout) {
          return "bg-white border-gray-200 text-gray-700 hover:border-gray-400 hover:bg-gray-50";
        }
        
        const isCorrectOption = quizState.options[index] === quizState.correctStr;
        
        if (isCorrectOption) {
          return "bg-emerald-50 border-emerald-500 text-emerald-800";
        }
        
        if (index === selectedAnswer && !isCorrectOption) {
          return "bg-rose-50 border-rose-500 text-rose-800";
        }
        
        return "bg-white border-gray-100 text-gray-400 opacity-50";
      };

      return (
        <div className="bg-white rounded-lg shadow-sm border border-gray-200 w-full relative overflow-hidden">
          
          {/* PAUSE OVERLAY */}
          {isPaused && !isGameOver && (
            <div className="absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center backdrop-blur-sm">
              <h2 className="text-2xl font-semibold text-gray-800 mb-6 tracking-tight">Assessment Paused</h2>
              <button onClick={() => setIsPaused(false)} className="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-md font-medium text-sm transition-colors">
                Resume Practice
              </button>
            </div>
          )}

          {/* GAME OVER OVERLAY */}
          {isGameOver && (
            <div className="absolute inset-0 bg-white z-30 flex flex-col items-center justify-center p-6 text-center">
              <h2 className="text-2xl font-semibold text-gray-900 mb-2 tracking-tight">Practice Complete</h2>
              <div className="text-base text-gray-500 mb-8">
                Final Score: <span className="text-gray-900 font-semibold">{score}</span>
              </div>
              <button onClick={handleRestart} className="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-md font-medium text-sm transition-colors">
                Start New Session
              </button>
            </div>
          )}

          {/* Header */}
          <div className="bg-white border-b border-gray-100 p-4 flex justify-between items-center">
            <div className="font-medium text-sm text-gray-600">
              Score: <span className="text-gray-900">{score}</span>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setIsPaused(true)} 
                className="text-gray-500 hover:text-gray-900 px-3 py-1.5 rounded text-xs font-medium border border-gray-200 hover:border-gray-300 transition-colors"
              >
                Pause
              </button>
              <button 
                onClick={() => setIsGameOver(true)} 
                className="text-gray-500 hover:text-gray-900 px-3 py-1.5 rounded text-xs font-medium border border-gray-200 hover:border-gray-300 transition-colors"
              >
                End Session
              </button>
            </div>
          </div>

          {/* Timer Bar */}
          <div className="h-[2px] bg-gray-100 w-full relative">
            <div 
              className="absolute top-0 left-0 h-full progress-bar bg-gray-800"
              style={{ width: `${(timeLeft / GAME_TIME) * 100}%` }}
            ></div>
          </div>

          {/* Question Area */}
          <div className="p-6 md:p-10">
            <div className="text-xs font-semibold text-gray-400 mb-4 tracking-widest uppercase">
              {quizState.category}
            </div>
            <h2 className="text-xl md:text-2xl font-medium text-gray-900 leading-snug mb-10 min-h-[4rem]">
              {quizState.text}
            </h2>

            {/* Options Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {quizState.options.map((option, index) => (
                <button
                  key={index}
                  onClick={() => handleAnswer(index)}
                  disabled={selectedAnswer !== null || isTimeout}
                  className={`w-full px-5 py-4 rounded-md border text-left text-sm md:text-base transition-colors duration-150 ${getButtonColor(index)}`}
                >
                  {option}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<QuizWidget />);
  </script>
</body>
</html>
