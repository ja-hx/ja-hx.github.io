<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Theme Vocabulary Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
        }

        /* 3D Flip Card Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        #card-inner {
            /* Smooth standard animation */
            transition: transform 0.6s ease-in-out;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50/60 min-h-screen flex items-center justify-center p-4 sm:p-8 overflow-hidden">

    <div class="w-full max-w-xl mx-auto flex flex-col relative z-10">
        
        <!-- Header Section -->
        <div class="flex flex-col gap-3 mb-6">
            <div class="flex justify-between items-end px-1">
                <div>
                    <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-100/50 px-2.5 py-1 rounded-md border border-blue-200/50 shadow-sm">
                        Vocabulary
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mt-3 tracking-tight">The Elderly </h1>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <span id="progress-text" class="text-xs sm:text-sm font-semibold text-slate-600 bg-white/80 backdrop-blur-sm border border-slate-200/80 px-3 py-1.5 rounded-full shadow-sm">
                        Card 1 of 20
                    </span>
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200/70 h-1.5 sm:h-2 rounded-full overflow-hidden shadow-inner mt-1">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-400 to-blue-600 h-full transition-all duration-500 w-[5%] rounded-full"></div>
            </div>
        </div>

        <!-- Flashcard Container -->
        <div id="flashcard" class="perspective-1000 w-full h-[320px] sm:h-[400px] cursor-pointer no-select group relative">
            
            <!-- Ambient Glow Wrapper -->
            <div id="glow-wrapper" class="absolute inset-0 rounded-3xl shadow-2xl shadow-blue-400/20 transition-all duration-700"></div>

            <div id="card-inner" class="relative w-full h-full transform-style-3d shadow-xl shadow-slate-300/40 transition-all duration-300 rounded-3xl bg-white">
                
                <!-- Front Face -->
                <div id="card-front" class="absolute w-full h-full backface-hidden bg-white border border-slate-200/80 rounded-3xl overflow-hidden flex flex-col">
                    <!-- Injected via JS -->
                </div>

                <!-- Back Face -->
                <div id="card-back" class="absolute w-full h-full backface-hidden bg-white border border-slate-200/80 rounded-3xl rotate-y-180 overflow-hidden flex flex-col">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- End Screen Overlay -->
            <div id="end-screen" class="absolute inset-0 bg-white/80 backdrop-blur-md z-20 rounded-3xl border border-white/50 shadow-2xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
                <div class="bg-green-100 text-green-600 p-4 rounded-full mb-4 shadow-sm border border-green-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Deck Completed!</h2>
                <p class="text-slate-500 text-sm font-medium mb-6 text-center px-6">You've successfully reviewed all 20 cards in this deck.</p>
                <button onclick="restartDeck()" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 hover:scale-105 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Restart & Shuffle
                </button>
            </div>
        </div>

        <!-- Glassmorphism Floating Dock -->
        <div class="mt-8 flex justify-center w-full relative z-30">
            <div class="flex items-center gap-2 sm:gap-3 p-2 bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl shadow-slate-200/50 rounded-full">
                
                <!-- Mode Toggle Button -->
                <button id="dock-btn-mode" onclick="toggleMode()" class="flex items-center justify-center px-5 py-2.5 rounded-full hover:bg-white border border-transparent hover:border-slate-200 shadow-sm hover:shadow text-sm font-bold text-blue-600 transition-all duration-300 focus:outline-none" title="Toggle Mode">
                    <span id="mode-text">Learning Mode</span>
                </button>

                <div class="w-px h-8 bg-slate-300 mx-1"></div>

                <!-- Prev Button -->
                <button onclick="prevCard()" class="p-3 rounded-full hover:bg-slate-100 text-slate-700 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-100 hover:scale-110 active:scale-95" title="Previous Card">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                
                <!-- Shuffle Button -->
                <button onclick="shuffleDeck()" class="p-3 rounded-full hover:bg-slate-100 text-slate-600 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-100 hover:scale-110 active:scale-95 hover:text-blue-600 hover:rotate-180" title="Shuffle Deck">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                </button>

                <!-- Next Button -->
                <button onclick="nextCard()" class="p-3 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-500/40 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-300 hover:scale-110 active:scale-95" title="Next Card">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="text-center text-[10px] sm:text-xs text-slate-400 font-medium mt-4 flex items-center justify-center gap-2">
            <span>Use keyboard:</span>
            <span class="flex gap-1">
                <kbd class="bg-white px-1.5 py-0.5 rounded border border-slate-200 shadow-sm text-slate-500">Space</kbd> to flip
            </span>
            <span class="flex gap-1 ml-1">
                <kbd class="bg-white px-1.5 py-0.5 rounded border border-slate-200 shadow-sm text-slate-500">←</kbd>
                <kbd class="bg-white px-1.5 py-0.5 rounded border border-slate-200 shadow-sm text-slate-500">→</kbd> to navigate
            </span>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "Ageing population", definition: "A demographic trend where the proportion of elderly people in a population increases significantly.", sentence: "Many developed nations are facing the economic challenges of an ageing population as birth rates decline." },
            { word: "Silver economy", definition: "The system of economic activities, products, and services designed to meet the needs of older people.", sentence: "Businesses are increasingly investing in the silver economy by designing accessible technologies for senior citizens." },
            { word: "Geriatric", definition: "Relating to old age or the healthcare and treatment of elderly people.", sentence: "Hospitals need more specialised doctors to meet the growing demand for geriatric care." },
            { word: "Intergenerational gap", definition: "A lack of understanding or communication between younger and older generations due to differing experiences and values.", sentence: "Community programmes aim to bridge the intergenerational gap by bringing teenagers and seniors together for storytelling sessions." },
            { word: "Autonomy", definition: "The right or condition of self-government; the freedom to make one's own decisions independently.", sentence: "Assisted living facilities should aim to protect the autonomy of residents by allowing them to maintain daily routines." },
            { word: "Ageism", definition: "Prejudice or discrimination on the grounds of a person's age.", sentence: "Combatting ageism in the workplace is essential so older workers are not overlooked for promotion based on stereotyping." },
            { word: "Infirmity", definition: "Physical or mental weakness brought on by old age or illness.", sentence: "Despite his physical infirmity, the retired professor maintained a sharp mind and continued writing books." },
            { word: "Social isolation", definition: "A state of complete or near-complete lack of contact between an individual and society.", sentence: "Without family nearby, many senior citizens experience severe social isolation, which negatively impacts their mental health." },
            { word: "Cognitive decline", definition: "The deterioration of mental processes such as memory, language, and problem-solving abilities.", sentence: "Regular mental exercises like reading and chess can help slow down cognitive decline in older adults." },
            { word: "Mobility impairment", definition: "A physical condition that limits or restricts an individual's ability to move independently.", sentence: "Public transport should be upgraded with ramps and low steps to assist commuters with mobility impairment." },
            { word: "Dependency", definition: "The state of relying on someone or something else for support, care, or financial aid.", sentence: "Chronic illness in old age often leads to physical dependency on caregivers for daily tasks." },
            { word: "Frailty", definition: "The condition of being weak and delicate, especially due to old age.", sentence: "Due to her increasing frailty, she found it difficult to carry heavy groceries upstairs." },
            { word: "Caregiver burnout", definition: "A state of physical, emotional, and mental exhaustion suffered by individuals caring for elderly or sick family members.", sentence: "Providing round-the-clock assistance without adequate support often leads to severe caregiver burnout." },
            { word: "Sedentary lifestyle", definition: "A way of living that involves little or no physical activity.", sentence: "Encouraging light daily exercise helps senior citizens avoid the health risks associated with a sedentary lifestyle." },
            { word: "Active ageing", definition: "The process of optimising opportunities for health, participation, and security to enhance quality of life as people age.", sentence: "Local councils promote active ageing by providing free fitness classes and social clubs for pensioners." },
            { word: "Assistive technology", definition: "Devices, equipment, or software designed to maintain or improve an individual's independence and functional capabilities.", sentence: "Smart home sensors and emergency alert buttons are forms of assistive technology that allow elderly people to live safely at home." },
            { word: "Institutional care", definition: "Professional residential care provided within a residential care home or nursing facility.", sentence: "While institutional care guarantees professional medical supervision, many seniors prefer remaining in their own homes for as long as possible." },
            { word: "Subsidised healthcare", definition: "Medical care partially or fully funded by the government or an organisation to reduce costs for patients.", sentence: "Providing subsidised healthcare ensures that vulnerable pensioners receive essential prescriptions without financial strain." },
            { word: "Age-friendly infrastructure", definition: "Public spaces, buildings, and transport systems built or adapted to be easily accessible to older citizens.", sentence: "The city introduced age-friendly infrastructure, including longer pedestrian crossing times and more public benches." },
            { word: "Multi-generational living", definition: "A household setup where two or more adult generations from the same family live together under one roof.", sentence: "Multi-generational living allows younger family members to provide daily support to ageing relatives while sharing household expenses." }
        ];

        let deckOrder = [];
        let currentIndex = 0;
        let isFlipped = false;
        let isTestingMode = false;
        let isEndScreenVisible = false;

        const cardContainer = document.getElementById('flashcard');
        const cardInner = document.getElementById('card-inner');
        const cardFront = document.getElementById('card-front');
        const cardBack = document.getElementById('card-back');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const glowWrapper = document.getElementById('glow-wrapper');
        const endScreen = document.getElementById('end-screen');
        const modeText = document.getElementById('mode-text');

        function init() {
            deckOrder = Array.from(Array(vocabulary.length).keys());
            renderCard();
            setupKeyboardShortcuts();
        }

        function renderCard() {
            const vocabIndex = deckOrder[currentIndex];
            const item = vocabulary[vocabIndex];

            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('rotate-y-180');
                setTimeout(() => updateText(item), 300);
            } else {
                updateText(item);
            }

            // Update Progress Text and Bar
            const currentCount = currentIndex + 1;
            progressText.innerText = `Card ${currentCount} of ${vocabulary.length}`;
            progressBar.style.width = `${(currentCount / vocabulary.length) * 100}%`;
        }

        function updateText(item) {
            // Badges Component
            const learnBadge = `<div class="absolute top-5 left-5 bg-blue-50 border border-blue-100 text-blue-600 text-[10px] font-bold uppercase tracking-widest px-3 py-1.5 rounded-full shadow-sm">Learning Mode</div>`;
            const testBadge = `<div class="absolute top-5 left-5 bg-indigo-50 border border-indigo-100 text-indigo-600 text-[10px] font-bold uppercase tracking-widest px-3 py-1.5 rounded-full shadow-sm">Testing Mode</div>`;
            const activeBadge = isTestingMode ? testBadge : learnBadge;

            // Word Face (Front in Learn, Back in Test)
            const wordHTML = `
                ${activeBadge}
                <div class="flex flex-col items-center justify-center h-full p-6 sm:p-10 text-center relative w-full bg-gradient-to-br from-white to-slate-50/50">
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-800 leading-tight drop-shadow-sm">${item.word}</h2>
                    <div class="absolute bottom-6 flex items-center gap-2 text-[10px] sm:text-xs text-slate-400 font-semibold tracking-wider">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        Click or press Space to flip
                    </div>
                </div>
            `;
            
            // Definition Face (Back in Learn, Front in Test)
            const definitionHTML = `
                ${activeBadge}
                <div class="flex flex-col justify-center h-full pt-14 pb-12 px-6 sm:px-10 custom-scrollbar overflow-y-auto relative w-full bg-gradient-to-b from-white to-slate-50/30">
                    <div class="mb-4 w-full">
                        <h3 class="text-[10px] sm:text-xs uppercase tracking-widest text-blue-500 font-bold mb-2 inline-block">Definition</h3>
                        <p class="text-slate-700 text-sm sm:text-[17px] leading-relaxed font-medium">${item.definition}</p>
                    </div>
                    ${!isTestingMode ? `
                    <div class="mt-2 pt-4 w-full border-t border-slate-100">
                        <h3 class="text-[10px] sm:text-xs uppercase tracking-widest text-blue-500 font-bold mb-2 inline-block">Sample Sentence</h3>
                        <p class="text-slate-600 text-sm sm:text-[15px] italic border-l-4 border-blue-400 pl-4 py-1 leading-relaxed bg-slate-50 rounded-r-md shadow-sm">"${item.sentence}"</p>
                    </div>` : ''}
                    <div class="absolute bottom-3 left-0 w-full text-center flex justify-center items-center gap-2 text-[10px] sm:text-xs text-slate-400 font-medium tracking-wide bg-gradient-to-t from-white to-transparent pt-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" /></svg>
                        Click or press Space to flip
                    </div>
                </div>
            `;

            if (isTestingMode) {
                cardFront.innerHTML = definitionHTML;
                cardBack.innerHTML = wordHTML;
            } else {
                cardFront.innerHTML = wordHTML;
                cardBack.innerHTML = definitionHTML;
            }
        }

        function toggleMode() {
            isTestingMode = !isTestingMode;
            
            // Toggle Text and Colors
            if (isTestingMode) {
                modeText.innerText = 'Testing Mode';
                modeText.parentElement.classList.remove('text-blue-600');
                modeText.parentElement.classList.add('text-indigo-600');
                glowWrapper.classList.remove('shadow-blue-400/20');
                glowWrapper.classList.add('shadow-indigo-500/20');
            } else {
                modeText.innerText = 'Learning Mode';
                modeText.parentElement.classList.remove('text-indigo-600');
                modeText.parentElement.classList.add('text-blue-600');
                glowWrapper.classList.remove('shadow-indigo-500/20');
                glowWrapper.classList.add('shadow-blue-400/20');
            }
            
            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('rotate-y-180');
                setTimeout(() => renderCard(), 300);
            } else {
                renderCard();
            }
        }

        function toggleFlip() {
            if (isEndScreenVisible) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        cardContainer.addEventListener('click', (e) => {
            // Prevent flipping if interacting with the end screen
            if (!isEndScreenVisible) toggleFlip();
        });

        function nextCard() {
            if (isEndScreenVisible) return;
            
            if (currentIndex < vocabulary.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                showEndScreen();
            }
        }

        function prevCard() {
            if (isEndScreenVisible) {
                hideEndScreen();
            } else if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function showEndScreen() {
            isEndScreenVisible = true;
            endScreen.classList.remove('opacity-0', 'pointer-events-none');
            // Max out progress bar
            progressBar.style.width = '100%';
            progressText.innerText = `Deck Completed`;
        }

        function hideEndScreen() {
            isEndScreenVisible = false;
            endScreen.classList.add('opacity-0', 'pointer-events-none');
            renderCard();
        }

        function restartDeck() {
            hideEndScreen();
            shuffleDeck();
        }

        function shuffleDeck() {
            for (let i = deckOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deckOrder[i], deckOrder[j]] = [deckOrder[j], deckOrder[i]];
            }
            currentIndex = 0; 
            hideEndScreen(); // Ensure end screen is hidden
            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('rotate-y-180');
                setTimeout(() => renderCard(), 300);
            } else {
                renderCard();
            }
            
            // Remove focus from the shuffle button so spacebar doesn't trigger it again
            if(document.activeElement) document.activeElement.blur();
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault(); // Stop page from scrolling or clicking focused buttons
                    toggleFlip();
                } else if (e.code === 'ArrowRight' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextCard();
                } else if (e.code === 'ArrowLeft' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevCard();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
