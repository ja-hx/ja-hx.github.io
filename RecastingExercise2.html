<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Choice Question</title>
<style>
  /* White and Blue Color Scheme */
  body {
    background-color: #f4f8fc;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .quiz-container {
    background-color: #ffffff;
    border: 2px solid #00509e;
    border-radius: 8px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    color: #003366;
    box-shadow: 0 4px 12px rgba(0, 80, 158, 0.1);
  }

  h3 {
    margin-top: 0;
    line-height: 1.4;
  }

  .options {
    display: flex;
    flex-direction: column; /* Lists options out one after the other */
    gap: 12px;
    margin-top: 20px;
  }

  .option {
    background-color: #ffffff;
    color: #00509e;
    border: 2px solid #00509e;
    padding: 15px 20px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    transition: background-color 0.3s, color 0.3s;
  }

  .option:hover:not(:disabled) {
    background-color: #e6f0fa;
  }

  /* Changes color when the user selects this option */
  .option.selected {
    background-color: #00509e;
    color: #ffffff;
    border-color: #00509e;
  }

  .option:disabled {
    cursor: default;
    opacity: 0.8;
  }

  .hidden {
    display: none;
  }

  #feedback-container {
    margin-top: 25px;
    padding: 20px;
    background-color: #f8fbff;
    border: 1px solid #cce0ff;
    border-radius: 6px;
  }

  /* Specific color requirements for results */
  .correct-text {
    color: green;
    font-weight: bold;
    font-size: 20px;
    margin: 0 0 10px 0;
  }

  .incorrect-text {
    color: red;
    font-weight: bold;
    font-size: 20px;
    margin: 0 0 10px 0;
  }

  #explanation {
    margin-bottom: 20px;
    line-height: 1.5;
  }

  #redo-btn {
    background-color: #00509e;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background-color 0.2s;
  }

  #redo-btn:hover {
    background-color: #003366;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h3>According to the writer, what is the appeal of visiting places like Mariner Valley on Mars, or Jupiter?</h3>
  
  <div class="options">
    <!-- Option 1 -->
    <button class="option" data-correct="false" data-explanation="Not answering the question as it is responding with yet another question.">
     'People have always sought out exotic locations, and what is more exotic than a whole other planet?’
    </button>
    
    
    <!-- Option 2 -->
    <button class="option" data-correct="true" data-explanation="Recast the rhetorical question into a statement.">
      These places are considered as exotic locations. 
    </button>
  </div>

  <div id="feedback-container" class="hidden">
    <div id="result-status"></div>
    <div id="explanation"></div>
    <button id="redo-btn">Redo Quiz</button>
  </div>
</div>

<script>
  const options = document.querySelectorAll('.option');
  const feedbackContainer = document.getElementById('feedback-container');
  const resultStatus = document.getElementById('result-status');
  const explanationText = document.getElementById('explanation');
  const redoBtn = document.getElementById('redo-btn');

  options.forEach(option => {
    option.addEventListener('click', function() {
      // Prevent clicking other options after one is selected
      options.forEach(opt => opt.disabled = true);
      
      // Add the blue 'selected' style to the clicked option
      this.classList.add('selected');
      
      // Retrieve the correctness and explanation from the button's data attributes
      const isCorrect = this.getAttribute('data-correct') === 'true';
      const explanation = this.getAttribute('data-explanation');
      
      // Reveal the feedback box
      feedbackContainer.classList.remove('hidden');
      
      // Inject the correct/incorrect text and the explanation
      if (isCorrect) {
        resultStatus.innerHTML = '<p class="correct-text">Correct</p>';
      } else {
        resultStatus.innerHTML = '<p class="incorrect-text">Incorrect</p>';
      }
      
      explanationText.innerText = "Explanation: " + explanation;
    });
  });

  // Reset everything when Redo is clicked
  redoBtn.addEventListener('click', function() {
    options.forEach(opt => {
      opt.disabled = false;
      opt.classList.remove('selected');
    });
    feedbackContainer.classList.add('hidden');
  });
</script>

</body>
</html>
